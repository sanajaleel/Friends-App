version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: friends_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: friends_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: friends_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:latest
    container_name: friends_coturn
    restart: always
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49152-49160:49152-49160/udp"
    command:
      - -n
      - --log-file=stdout
      - --min-port=49152
      - --max-port=49160
      - --realm=friendsapp.local
      - --user=friendsuser:friendspassword

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: friends_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/friends_app?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super-secret-production-key-friends-app-32chars
      TURN_SERVER_URL: turn:coturn:3478
      TURN_USERNAME: friendsuser
      TURN_PASSWORD: friendspassword
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

